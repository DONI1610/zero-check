<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Zero-Width Decoder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f1a;
            font-family: system-ui, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .box {
            max-width: 550px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 28px;
            border: 1px solid #4c6ef5;
        }
        h1 {
            color: #fff;
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            height: 160px;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 16px;
        }
        textarea:focus {
            outline: none;
            border-color: #4c6ef5;
        }
        button {
            width: 100%;
            background: #4c6ef5;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background: #5f7bf6;
        }
        .result {
            background: #0a0a12;
            border-radius: 14px;
            padding: 14px;
            border-left: 4px solid #4c6ef5;
        }
        .result-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-text {
            color: #4c6ef5;
            word-break: break-all;
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
        }
        .error {
            border-left-color: #e94560;
        }
        .error .result-text {
            color: #e94560;
        }
        hr {
            border-color: #2a2a4a;
            margin: 16px 0;
        }
        .note {
            color: #555;
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>🕵️ Zero-Width</h1>
    <div class="sub">Giải mã ký tự vô hình</div>

    <textarea id="inputText" placeholder="Dán đoạn chat có ký tự zero-width vào đây..."></textarea>
    
    <button id="decodeBtn">🔓 Giải mã</button>
    
    <div class="result" id="resultBox" style="display: none;">
        <div class="result-label">📄 Thông điệp ẩn:</div>
        <div class="result-text" id="resultText"></div>
    </div>
    
    <div class="note">
        💡 Dán đoạn chat đã giấu ký tự → bấm Giải mã
    </div>
</div>

<script>
    const ZWSP = '\u200B';
    const ZWNJ = '\u200C';

    function decode(text) {
        let hidden = '';
        for (let ch of text) {
            if (ch === ZWSP || ch === ZWNJ) hidden += ch;
        }
        if (hidden.length === 0) return null;
        
        let binary = '';
        for (let ch of hidden) {
            binary += (ch === ZWSP) ? '1' : '0';
        }
        
        // Cắt cho đủ 16 bit
        binary = binary.substr(0, Math.floor(binary.length / 16) * 16);
        
        // Chuyển binary sang text
        let result = '';
        for (let i = 0; i < binary.length; i += 16) {
            let byte = binary.substr(i, 16);
            if (byte.length === 16) {
                result += String.fromCharCode(parseInt(byte, 2));
            }
        }
        return result || null;
    }

    document.getElementById('decodeBtn').onclick = () => {
        const input = document.getElementById('inputText').value;
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        
        if (!input.trim()) {
            resultText.textContent = '⚠️ Hãy dán đoạn chat vào ô trên!';
            resultBox.classList.add('error');
            resultBox.style.display = 'block';
            return;
        }
        
        const decoded = decode(input);
        
        if (decoded && decoded.length > 0) {
            resultText.textContent = decoded;
            resultBox.classList.remove('error');
            resultBox.style.display = 'block';
        } else {
            resultText.textContent = '❌ Không tìm thấy thông điệp! Đoạn này không có ký tự zero-width.';
            resultBox.classList.add('error');
            resultBox.style.display = 'block';
        }
    };
</script>
</body>
</html>
